# This file is managed by the repo-content-updater project. Manual changes here will result in a PR to bring back
# inline with the upstream template, unless you add !dependabot to the repo's managed-files property

version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - github_actions
      - "Changed"
    exclude-paths:
      - ".github/workflows/dependency-artifact-review.yml"
      - ".github/workflows/dependency-review.yml"
  - package-ecosystem: "npm"
    directories: ["/"]
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    rebase-strategy: auto
    labels:
      - dependencies
      - javascript
      - "Changed"
    # @types/node tracks the Node runtime in use; take its major bumps with the runtime.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
